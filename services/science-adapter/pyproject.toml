dependencies = ["fastapi==0.121.1", "uvicorn==0.38.0", "jsonschema[format]==4.25.1", "numpy==2.5.4", "pandas==2.3.3", "scikit-learn==1.7.2", "scipy==1.16.2", "joblib==1.5.2"]

[dependency-groups]
